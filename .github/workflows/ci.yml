name: .NET MAUI CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore

    - name: Build Android Target (Ignoring Tests)
      run: dotnet build PosApp/PosApp.csproj --configuration Release --framework net9.0-android --no-restore -p:DefaultItemExcludes="PosApp.Tests\**"

    - name: Run Unit Tests
      run: dotnet test PosApp.Tests/PosApp.Tests.csproj --configuration Release --no-build